<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام متابعة التمارين السحابي مع الاستريك</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-state-0 { background: #334155; color: #94a3b8; }
    .btn-state-1 { background: #059669; color: #ffffff; box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
    .btn-state-2 { background: #dc2626; color: #ffffff; box-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- Auth Container -->
  <div id="auth-screen" class="max-w-md mx-auto mt-16 glass p-8 rounded-2xl shadow-2xl">
    <div class="text-center mb-6">
      <i class="fa-solid fa-dumbbell text-4xl text-emerald-400 mb-2"></i>
      <h1 class="text-2xl font-bold">تسجيل الدخول / حساب جديد</h1>
      <p class="text-slate-400 text-sm mt-1">سجل يدوياً ليتم حفظ تمارينك واستريكك سحابياً</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">اسم المستخدم</label>
        <input type="text" id="auth-username" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500" placeholder="أدخل اسمك">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">كلمة السر</label>
        <input type="password" id="auth-password" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
      </div>
      <button onclick="handleAuth()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-lg transition duration-200 shadow-lg shadow-emerald-900/40">
        دخول / إنشاء حساب
      </button>
      <p id="auth-error" class="text-red-400 text-xs text-center hidden"></p>
    </div>
  </div>

  <!-- Main App Screen (Hidden initially) -->
  <div id="app-screen" class="max-w-4xl mx-auto space-y-6 hidden">
    
    <!-- Top Bar -->
    <div class="glass p-4 rounded-xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold" id="user-avatar">
          U
        </div>
        <div>
          <h2 class="font-bold text-lg flex items-center gap-2">
            <span id="welcome-username">مرحباً</span>
            <span id="user-streak-badge" class="bg-orange-500/20 text-orange-400 text-xs px-2 py-0.5 rounded-full border border-orange-500/30 flex items-center gap-1 hidden">
              <i class="fa-solid fa-fire text-orange-500"></i> <span id="user-streak-count">0</span> يوم
            </span>
          </h2>
          <span class="text-xs text-emerald-400 font-semibold"><i class="fa-solid fa-cloud"></i> متصل بالسحابة</span>
        </div>
      </div>
      <button onclick="logout()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm border border-slate-700">
        <i class="fa-solid fa-right-from-bracket"></i> خروج
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex gap-2 border-b border-slate-700 pb-2">
      <button onclick="switchTab('tracker')" id="tab-tracker-btn" class="px-4 py-2 rounded-lg font-bold bg-emerald-600 text-white">جدول التمارين</button>
      <button onclick="switchTab('leaderboard')" id="tab-leaderboard-btn" class="px-4 py-2 rounded-lg font-bold text-slate-400 hover:bg-slate-800">ترتيب الاستريك 🔥</button>
      <button onclick="switchTab('editor')" id="tab-editor-btn" class="px-4 py-2 rounded-lg font-bold text-slate-400 hover:bg-slate-800">تعديل التمارين</button>
    </div>

    <!-- TAB 1: TRACKER -->
    <div id="tab-tracker" class="space-y-4">
      <div class="glass p-4 rounded-xl flex justify-between items-center">
        <div>
          <span class="text-slate-400 text-sm">معدل الإنجاز الأسبوعي</span>
          <h3 class="text-2xl font-bold text-emerald-400" id="completion-rate">0%</h3>
        </div>
        <button onclick="resetWeekProgress()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded border border-slate-700">
          إعادة ضبط الأسبوع
        </button>
      </div>

      <div id="days-container" class="space-y-4">
        <!-- Days rendered dynamically -->
      </div>
    </div>

    <!-- TAB 2: LEADERBOARD -->
    <div id="tab-leaderboard" class="glass p-6 rounded-xl hidden space-y-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-trophy text-yellow-400"></i> قائمة المتصدرين بالاستريك
        </h3>
        <span class="text-xs text-slate-400">يبدأ الاستريك من ثاني يوم متتالي 🔥</span>
      </div>
      <div id="leaderboard-list" class="space-y-3">
        <!-- Ranked Users list -->
      </div>
    </div>

    <!-- TAB 3: EDITOR -->
    <div id="tab-editor" class="glass p-6 rounded-xl hidden space-y-4">
      <h3 class="text-xl font-bold mb-2">إدارة التمارين الأسبوعية</h3>
      <p class="text-xs text-slate-400 mb-4">أضف أو أعد ترتيب التمارين في جدولك الخاص</p>
      <div id="editor-container" class="space-y-4">
        <!-- Exercise Editor rendered here -->
      </div>
      <button onclick="saveCustomExercises()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg">
        حفظ التغييرات
      </button>
    </div>

  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBQPFObpJBVioy0CSl00vc-tmcImy_MsII",
      authDomain: "gymf-6204f.firebaseapp.com",
      databaseURL: "https://gymf-6204f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "gymf-6204f",
      storageBucket: "gymf-6204f.firebasestorage.app",
      messagingSenderId: "635075142021",
      appId: "1:635075142021:web:91cac6da0a14938e5d24ec",
      measurementId: "G-V67TRKXMB0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Default Days and Workouts Template
    const defaultSchedule = [
      { day: "السبت", exercises: ["بوش اب (Push-ups)", "عقلة (Pull-ups)"] },
      { day: "الأحد", exercises: ["سكوات (Squats)", "بلانك (Plank)"] },
      { day: "الإثنين", exercises: ["راحة واستشفاء"] },
      { day: "الثلاثاء", exercises: ["بوش اب (Push-ups)", "عقلة (Pull-ups)"] },
      { day: "الأربعاء", exercises: ["سكوات (Squats)", "تمارين بطن (Crunches)"] },
      { day: "الخميس", exercises: ["بوش اب", "سكوات", "عقلة"] },
      { day: "الجمعة", exercises: ["راحة تامة"] }
    ];

    let currentUser = null;
    let userData = null;

    // Calculate Streak (Starts from 2 consecutive completed days)
    function calculateStreak(uData) {
      if (!uData || !uData.schedule || !uData.tracker) return 0;
      
      let consecutiveDays = 0;
      for (let dayIdx = 0; dayIdx < uData.schedule.length; dayIdx++) {
        const dayExs = uData.schedule[dayIdx].exercises;
        if (!dayExs || dayExs.length === 0) continue;

        let allDone = true;
        dayExs.forEach((_, exIdx) => {
          if (!uData.tracker[dayIdx] || uData.tracker[dayIdx][exIdx] !== 1) {
            allDone = false;
          }
        });

        if (allDone) {
          consecutiveDays++;
        } else {
          // Break streak if an uncompleted day is reached after starting
          if (consecutiveDays < 2) consecutiveDays = 0;
          else break;
        }
      }

      // Streak condition: Starts appearing from 2nd consecutive day
      return consecutiveDays >= 2 ? consecutiveDays : 0;
    }

    // Authentication Logic
    function handleAuth() {
      const usernameInput = document.getElementById("auth-username").value.trim();
      const passwordInput = document.getElementById("auth-password").value.trim();
      const errEl = document.getElementById("auth-error");

      if (!usernameInput || !passwordInput) {
        errEl.innerText = "يرجى كتابة الاسم وكلمة السر";
        errEl.classList.remove("hidden");
        return;
      }

      const userRef = db.ref("users/" + usernameInput);
      userRef.once("value", (snapshot) => {
        const val = snapshot.val();
        if (val) {
          if (val.password === passwordInput) {
            currentUser = usernameInput;
            userData = val.data || createDefaultUserData();
            loginSuccess();
          } else {
            errEl.innerText = "كلمة السر غير صحيحة!";
            errEl.classList.remove("hidden");
          }
        } else {
          currentUser = usernameInput;
          userData = createDefaultUserData();
          userRef.set({
            password: passwordInput,
            data: userData
          });
          loginSuccess();
        }
      });
    }

    function createDefaultUserData() {
      const tracker = {};
      defaultSchedule.forEach((d, dIdx) => {
        tracker[dIdx] = {};
        d.exercises.forEach((ex, exIdx) => {
          tracker[dIdx][exIdx] = 0;
        });
      });
      return {
        schedule: defaultSchedule,
        tracker: tracker
      };
    }

    function loginSuccess() {
      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      document.getElementById("welcome-username").innerText = currentUser;
      document.getElementById("user-avatar").innerText = currentUser.charAt(0).toUpperCase();

      db.ref("users/" + currentUser + "/data").on("value", (snap) => {
        if(snap.val()) {
          userData = snap.val();
          renderTracker();
          renderEditor();
        }
      });

      listenLeaderboard();
      renderTracker();
    }

    function logout() {
      if(currentUser) db.ref("users/" + currentUser + "/data").off();
      currentUser = null;
      document.getElementById("app-screen").classList.add("hidden");
      document.getElementById("auth-screen").classList.remove("hidden");
    }

    // Tab Switching
    function switchTab(tabName) {
      ['tracker', 'leaderboard', 'editor'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}-btn`).className = "px-4 py-2 rounded-lg font-bold text-slate-400 hover:bg-slate-800";
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-${tabName}-btn`).className = "px-4 py-2 rounded-lg font-bold bg-emerald-600 text-white";
    }

    // Toggle Exercise State
    function toggleExerciseState(dayIdx, exIdx) {
      if (!userData.tracker[dayIdx]) userData.tracker[dayIdx] = {};
      let curr = userData.tracker[dayIdx][exIdx] || 0;
      let next = (curr + 1) % 3;
      userData.tracker[dayIdx][exIdx] = next;

      db.ref("users/" + currentUser + "/data").set(userData);
    }

    // Render Tracker
    function renderTracker() {
      const container = document.getElementById("days-container");
      container.innerHTML = "";

      let totalTasks = 0;
      let completedTasks = 0;

      userData.schedule.forEach((d, dayIdx) => {
        const dayCard = document.createElement("div");
        dayCard.className = "glass p-4 rounded-xl space-y-3";

        let exercisesHtml = "";
        d.exercises.forEach((ex, exIdx) => {
          totalTasks++;
          const state = (userData.tracker[dayIdx] && userData.tracker[dayIdx][exIdx]) || 0;
          if (state === 1) completedTasks++;

          let btnIcon = state === 1 ? '<i class="fa-solid fa-check"></i>' : (state === 2 ? '<i class="fa-solid fa-xmark"></i>' : '');
          let btnClass = `btn-state-${state}`;

          exercisesHtml += `
            <div class="flex items-center justify-between bg-slate-900/60 p-3 rounded-lg border border-slate-800">
              <span class="text-sm font-medium">${ex}</span>
              <button onclick="toggleExerciseState(${dayIdx}, ${exIdx})" class="w-9 h-9 rounded-lg font-bold flex items-center justify-center transition-all ${btnClass}">
                ${btnIcon}
              </button>
            </div>
          `;
        });

        dayCard.innerHTML = `
          <h4 class="font-bold text-emerald-400 text-md border-b border-slate-800 pb-2">${d.day}</h4>
          <div class="space-y-2">${exercisesHtml}</div>
        `;
        container.appendChild(dayCard);
      });

      const percentage = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
      document.getElementById("completion-rate").innerText = `${percentage}%`;

      // Update User Streak Badge in Header
      const streak = calculateStreak(userData);
      const badgeEl = document.getElementById("user-streak-badge");
      if (streak >= 2) {
        document.getElementById("user-streak-count").innerText = streak;
        badgeEl.classList.remove("hidden");
      } else {
        badgeEl.classList.add("hidden");
      }
    }

    // Leaderboard Sorted by Streak then Progress
    function listenLeaderboard() {
      db.ref("users").on("value", (snap) => {
        const users = snap.val();
        const listEl = document.getElementById("leaderboard-list");
        listEl.innerHTML = "";

        if (!users) return;

        let userList = [];

        Object.keys(users).forEach(uName => {
          const uData = users[uName].data;
          if (!uData || !uData.tracker) return;

          let total = 0, done = 0;
          uData.schedule.forEach((d, dayIdx) => {
            d.exercises.forEach((ex, exIdx) => {
              total++;
              if (uData.tracker[dayIdx] && uData.tracker[dayIdx][exIdx] === 1) done++;
            });
          });

          const pct = total > 0 ? Math.round((done / total) * 100) : 0;
          const streak = calculateStreak(uData);

          userList.push({ name: uName, streak: streak, pct: pct });
        });

        // Sort by streak (descending), then by percentage (descending)
        userList.sort((a, b) => b.streak - a.streak || b.pct - a.pct);

        userList.forEach((u, index) => {
          let rankBadge = `<span class="w-6 text-center font-bold text-slate-500">${index + 1}</span>`;
          if (index === 0) rankBadge = `<span class="w-6 text-center text-lg">🥇</span>`;
          else if (index === 1) rankBadge = `<span class="w-6 text-center text-lg">🥈</span>`;
          else if (index === 2) rankBadge = `<span class="w-6 text-center text-lg">🥉</span>`;

          const item = document.createElement("div");
          item.className = "flex items-center justify-between bg-slate-900/80 p-3 rounded-lg border border-slate-800";
          item.innerHTML = `
            <div class="flex items-center gap-3">
              ${rankBadge}
              <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs">${u.name.charAt(0).toUpperCase()}</div>
              <div>
                <span class="font-bold text-sm block">${u.name}</span>
                <span class="text-[10px] text-slate-400">الإنجاز الأسبوعي: ${u.pct}%</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              ${u.streak >= 2 
                ? `<span class="bg-orange-500/20 text-orange-400 text-xs px-2.5 py-1 rounded-full border border-orange-500/30 font-bold flex items-center gap-1"><i class="fa-solid fa-fire text-orange-500"></i> ${u.streak} أيام</span>` 
                : `<span class="text-xs text-slate-500">لا يوجد استريك</span>`
              }
            </div>
          `;
          listEl.appendChild(item);
        });
      });
    }

    // Reset Progress
    function resetWeekProgress() {
      if (confirm("هل تريد إعادة ضبط تقدم الأسبوع بالكامل؟ (سيتم إعادة ضبط الاستريك)")) {
        userData.schedule.forEach((d, dayIdx) => {
          if (!userData.tracker[dayIdx]) userData.tracker[dayIdx] = {};
          d.exercises.forEach((ex, exIdx) => {
            userData.tracker[dayIdx][exIdx] = 0;
          });
        });
        db.ref("users/" + currentUser + "/data").set(userData);
      }
    }

    // Editor Logic
    function renderEditor() {
      const container = document.getElementById("editor-container");
      container.innerHTML = "";

      userData.schedule.forEach((d, dayIdx) => {
        const div = document.createElement("div");
        div.className = "bg-slate-900/80 p-3 rounded-lg border border-slate-800 space-y-2";
        div.innerHTML = `
          <label class="block text-xs font-bold text-emerald-400">${d.day}</label>
          <input type="text" id="edit-day-${dayIdx}" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs text-white" value="${d.exercises.join(', ')}">
          <span class="text-[10px] text-slate-500">افصل بين التمارين بفاصلة (,)</span>
        `;
        container.appendChild(div);
      });
    }

    function saveCustomExercises() {
      userData.schedule.forEach((d, dayIdx) => {
        const inputVal = document.getElementById(`edit-day-${dayIdx}`).value;
        d.exercises = inputVal.split(',').map(e => e.trim()).filter(e => e.length > 0);
      });
      db.ref("users/" + currentUser + "/data").set(userData);
      alert("تم حفظ التعديلات سحابياً!");
      switchTab('tracker');
    }
  </script>
</body>
</html>
